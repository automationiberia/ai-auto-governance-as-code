---
schemaVersion: 2.3.0
metadata:
  name: automation-home
  displayName: Automation Home
  description: >-
    AI-Driven Governance-as-Code for Ansible Automation — Copilot Agent,
    Continue + Ollama (qwen2.5-coder:7b, CPU), white paper, skills, and
    delivery submodule.
  tags:
    - ansible
    - automation
    - ollama
  language: Ansible
  projectType: Ansible
components:
  - name: automation-tools
    container:
      image: ghcr.io/ansible/ansible-devspaces:latest
      mountSources: true
      cpuLimit: 4000m
      cpuRequest: 250m
      memoryRequest: 512Mi
      memoryLimit: 8Gi
      env:
        - name: AUTOMATION_HOME
          value: ${PROJECT_SOURCE}
        - name: AUTOMATION_REPO
          value: ${PROJECT_SOURCE}/deliveries/automation
        - name: VSCODE_DEFAULT_WORKSPACE
          value: ${PROJECT_SOURCE}/automation-home.code-workspace
        - name: ANSIBLE_COLLECTIONS_PATH
          value: >-
            ${PROJECT_SOURCE}/deliveries/automation/.ansible/collections:
            /usr/share/ansible/collections
        # Do NOT set DEFAULT_EXTENSIONS or PATH here — paths under
        # ${PROJECT_SOURCE} do not exist during the DWO-injected postStart hook
        # and can fail automation-tools. Copilot: extensions.json +
        # setup-workspace VSIX; PATH → automation-home.code-workspace.
        - name: VSCODE_TRUSTED_EXTENSIONS
          value: redhat.devspaces-copilot-chat-integration
        # lola-ai requires Python >= 3.13; setup-workspace.sh ensures this
        # (ansible-devspaces image currently ships 3.12 — uv installs 3.13).
        - name: PYTHON_MIN_VERSION
          value: "3.13"
        - name: UV_PYTHON
          value: "3.13"
  - name: ollama
    container:
      # Red Hat Ollama stack: per-user PVC at /.ollama (OpenShift arbitrary UID).
      image: docker.io/ollama/ollama:0.5.4
      mountSources: true
      sourceMapping: /.ollama
      cpuLimit: 4000m
      cpuRequest: 500m
      memoryRequest: 4Gi
      memoryLimit: 10Gi
      env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
commands:
  - id: setup-workspace
    exec:
      component: automation-tools
      commandLine: bash .devfile/setup-workspace.sh
      workingDir: ${PROJECT_SOURCE}
      label: Setup workspace (submodules, pip, pre-commit)
  - id: pre-commit-home
    exec:
      component: automation-tools
      commandLine: >-
        bash -lc '"${AUTOMATION_HOME}/.venv/bin/pre-commit" run --all-files'
      workingDir: ${PROJECT_SOURCE}
      label: Pre-commit (automation-home)
  - id: pre-commit-delivery
    exec:
      component: automation-tools
      commandLine: >-
        bash -lc 'cd "${AUTOMATION_REPO}" &&
        "${AUTOMATION_HOME}/.venv/bin/pre-commit" run --all-files'
      workingDir: ${PROJECT_SOURCE}
      label: Pre-commit (delivery collection)
  - id: syntax-check-delivery
    exec:
      component: automation-tools
      commandLine: >-
        bash -lc 'cd "${AUTOMATION_REPO}" && ansible-playbook --syntax-check
        playbooks/type_linux_ntp.yml && ansible-playbook --syntax-check
        playbooks/type_linux_ssh_home_jail.yml && ansible-playbook --syntax-check
        playbooks/type_windows_ntp.yml'
      workingDir: ${PROJECT_SOURCE}
      label: Syntax-check delivery playbooks
  - id: ollama-pull-qwen
    exec:
      component: automation-tools
      commandLine: bash .devfile/ollama-pull.sh
      workingDir: ${PROJECT_SOURCE}
      label: Pull Ollama model (qwen2.5-coder:7b)
  - id: setup-workspace-bg
    exec:
      component: automation-tools
      commandLine: >-
        sh -c 'mkdir -p .devfile &&
        nohup bash .devfile/setup-workspace.sh </dev/null
        >>.devfile/setup-workspace.log 2>&1 &
        exit 0'
      workingDir: ${PROJECT_SOURCE}
      label: Setup workspace (background, postStart)
events:
  postStart:
    - setup-workspace-bg
# Also runs via .vscode/tasks.json (folderOpen) when the IDE opens.
# Log: .devfile/setup-workspace.log — manual: Command Palette → Setup workspace.
