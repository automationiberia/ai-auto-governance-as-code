---
# GaC marketplace — publishes the `gac` module from THIS repo (not ai-forge).
# ai-forge SDLC is pulled via dependencies (ansible-collection-sdlc).
# Before install: add ansible-content market from ai-forge lola-market.yml
name: Governance as Code
description: Governance as Code platform for Ansible automation
version: 1.0.0

modules:
  - name: gac
    description: >-
      Governance as Code platform with version-controlled CoP compliance,
      AAP architecture patterns, and AI agents. Consumes ai-forge for SDLC.
    version: 1.0.0
    repository: https://github.com/automationiberia/ai-auto-governance-as-code.git
    path: .
    dependencies:
      - "@ansible-content/ansible-collection-sdlc"
    tags: [governance, aap, automation, compliance]
