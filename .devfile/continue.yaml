---
# Optional Dev Spaces stack — Continue.dev + private LLM (NOT the default devfile).
# Create workspace with: ?devfilePath=.devfile/continue.yaml
# Default workspace for this repo: .devfile.yaml (Ansible + GitHub Copilot Agent).
schemaVersion: 2.3.0
metadata:
  name: vscode-continue-ai-env
  displayName: Continue.dev AI (optional)
  description: >-
    VS Code environment with Continue.dev AI assistant. Requires cluster secrets
    for CONTINUE_MODEL_* and CONTEXT7_API_KEY (mount-as env).
components:
  - name: vscode-editor
    container:
      image: quay.io/devfile/universal-developer-image:latest
      mountSources: true
commands:
  - id: copy-continue-dir
    exec:
      component: vscode-editor
      commandLine: |
        sh -c "
        echo '[postStart] Copying full .continue folder to ~/.continue (resolving env placeholders)...'
        mkdir -p /home/user/.continue
        cp -r \"$PROJECT_SOURCE/.continue/\"* /home/user/.continue/
        name=\"$CONTINUE_MODEL_NAME\"
        key=\"$CONTINUE_MODEL_API_KEY\"
        url=\"$CONTINUE_MODEL_API_URL\"
        ctx7key=\"$CONTEXT7_API_KEY\"
        awk -v n=\"\$name\" -v k=\"\$key\" -v u=\"\$url\" '
          BEGIN {
            gsub(/\\\\/, \"\\\\\\\\\", n); gsub(/&/, \"\\\\&\", n)
            gsub(/\\\\/, \"\\\\\\\\\", k); gsub(/&/, \"\\\\&\", k)
            gsub(/\\\\/, \"\\\\\\\\\", u); gsub(/&/, \"\\\\&\", u)
          }
          {
            gsub(/\\\$\{CONTINUE_MODEL_NAME\}/, n)
            gsub(/\\\$\{CONTINUE_MODEL_API_KEY\}/, k)
            gsub(/\\\$\{CONTINUE_MODEL_API_URL\}/, u)
            print
          }
        ' \"$PROJECT_SOURCE/.continue/config.yaml\" > /home/user/.continue/config.yaml
        awk -v c7=\"\$ctx7key\" '
          BEGIN {
            gsub(/\\\\/, \"\\\\\\\\\", c7)
            gsub(/\"/, \"\\\\\\\"\", c7)
          }
          { gsub(/\\\$\{CONTEXT7_API_KEY\}/, c7); print }
        ' \"$PROJECT_SOURCE/.continue/mcpServers/mcp.json\" > /home/user/.continue/mcpServers/mcp.json
        echo '[postStart] Done: .continue copied with Continue and MCP placeholders resolved from workspace env'
        "
      workingDir: ${PROJECT_SOURCE}
      label: Copy Continue config to home
  - id: install-continue-cli
    exec:
      component: vscode-editor
      commandLine: >-
        sh -c "echo '[postStart] Installing Continue CLI...' &&
        npm i -g @continuedev/cli &&
        echo '[postStart] Done: Continue CLI installed'"
      label: Install Continue CLI
events:
  postStart:
    - copy-continue-dir
    - install-continue-cli
